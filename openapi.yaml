openapi: 3.0.3
info:
  title: PES Canteen Automation API
  version: 1.0.0
  description: |
    Public HTTP endpoints of the PES University Canteen Automation System.
    Mutations (ordering, status changes, payments, administration) are implemented as
    Next.js Server Actions, not REST endpoints; their inputs are described in `schemas/`.
paths:
  /api/health:
    get:
      summary: Liveness and database connectivity
      responses:
        "200":
          description: Application and database are reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [ok] }
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [degraded] }
                  database: { type: string, enum: [unavailable] }
  /api/stalls/{stallId}/slots:
    get:
      summary: Bookable pickup slots with remaining capacity (FR-38)
      description: |
        Returns 15-minute slots for each bookable campus day (per the admin booking policy),
        excluding slots that are expired or within the minimum lead time. Not cached.
      parameters:
        - name: stallId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Slot availability by day
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      required: [date, slots]
                      properties:
                        date: { type: string, format: date, description: Campus-local date (Asia/Kolkata) }
                        slots:
                          type: array
                          items:
                            type: object
                            required: [startsAt, endsAt, remaining, capacity]
                            properties:
                              startsAt: { type: string, format: date-time }
                              endsAt: { type: string, format: date-time }
                              remaining: { type: integer, minimum: 0 }
                              capacity: { type: integer, minimum: 1 }
        "404":
          description: Stall not found
